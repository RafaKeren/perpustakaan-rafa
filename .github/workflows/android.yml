name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip and Fix Folder Structure
        run: |
          unzip -o *.zip || true
          if [ ! -f "gradlew" ]; then
            SUBFOLDER=$(find . -mindepth 2 -maxdepth 2 -name "gradlew" -exec dirname {} \;)
            if [ -n "$SUBFOLDER" ]; then
              echo "Memindahkan file dari $SUBFOLDER ke folder utama..."
              cp -r $SUBFOLDER/* . 2>/dev/null || true
              cp -r $SUBFOLDER/.* . 2>/dev/null || true
            fi
          fi
          chmod +x gradlew || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            **/build/outputs/apk/debug/*.apk
